<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Chat with Andrew's Clone in text and voice.">
  <title>Andrew's Clone — Text &amp; Voice</title>
  <link rel="stylesheet" href="/assets/app.css?v=chat-2">
  <script src="/assets/session.js?v=session-1" defer></script>
  <script src="/assets/app.js?v=session-1" defer></script>
</head>
<body>
  <main class="shell chat-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Andrew's Clone home"><span class="brand-mark">AC</span><span>Andrew's Clone</span></a>
      <div class="top-actions">
        <div class="talk-to-picker">
          <label for="model-provider">Talk to</label>
          <select id="model-provider">
            <option value="qwen" selected>Andrew</option>
            <option value="openai">OpenAI</option>
          </select>
        </div>
        <button id="new-chat-button" class="button button-quiet" type="button">New chat</button>
        <button id="auth-button" class="button button-quiet" type="button" hidden>Sign in</button>
      </div>
    </header>
    <p id="conversation-mode" class="conversation-mode">Andrew · Text &amp; voice</p>
    <section id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation">
      <article class="message message-assistant">
        <div class="message-avatar" aria-hidden="true">AC</div>
        <div class="message-content"><span class="message-label">Andrew's Clone</span><p>Hi, I'm here. What would you like to talk about?</p></div>
      </article>
    </section>
    <form id="composer-form" class="composer chat-composer">
      <div class="composer-head"><label for="text-input">Your message</label><span id="count">0 / 2000</span></div>
      <textarea id="text-input" maxlength="2000" placeholder="Write a message..." rows="3" required></textarea>
      <div class="composer-foot"><span id="status" role="status">Connecting...</span><button id="speak-button" class="button button-primary" type="submit" disabled>Send</button></div>
    </form>
    <footer><span>AI-generated replies · Synthetic voice</span><span id="account-label"></span></footer>
  </main>
</body>
</html>
